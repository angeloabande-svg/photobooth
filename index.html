<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- App Container -->
    <div id="app" class="flex flex-col items-center max-w-md w-full">
        
        <!-- Header / Title -->
        <h1 class="text-2xl font-bold mb-1 text-center">Get Your Digital Copies</h1>
        <p class="text-sm text-gray-400 mb-6 text-center">Scan QR to download your photo</p>

        <!-- QR Display Section -->
        <div class="flex flex-row gap-4 mb-6">
            <!-- Animated GIF QR Card -->
            <div class="bg-white text-black p-4 rounded-xl flex flex-col items-center shadow-lg">
                <div id="gif-qrcode-container" class="w-[90px] h-[90px] flex items-center justify-center mb-2"></div>
                <span class="text-xs font-semibold tracking-wider">Animated GIF</span>
            </div>

            <!-- HD Color QR Card -->
            <div class="bg-white text-black p-4 rounded-xl flex flex-col items-center shadow-lg">
                <div id="jpg-qrcode-container" class="w-[90px] h-[90px] flex items-center justify-center mb-2"></div>
                <span class="text-xs font-semibold tracking-wider">HD Color</span>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="resetSession()" class="w-full bg-[#1e1e1e] hover:bg-[#2e2e2e] text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-md">
            FINISH & RESET SESSION
        </button>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Your live GitHub Pages public URL
        const LIVE_SITE_URL = "https://angeloabande-svg.github.io/photobooth/";

        function renderDigitalQRs() {
            const gifContainer = document.getElementById('gif-qrcode-container');
            const jpgContainer = document.getElementById('jpg-qrcode-container');
            
            // Clear out any previous QR elements
            gifContainer.innerHTML = "";
            jpgContainer.innerHTML = "";

            // Generate HD Color QR pointing to your live cloud URL
            new QRCode(jpgContainer, {
                text: LIVE_SITE_URL,
                width: 90,
                height: 90,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Generate Animated GIF QR pointing to your live cloud URL
            new QRCode(gifContainer, {
                text: LIVE_SITE_URL,
                width: 90,
                height: 90,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function resetSession() {
            // Placeholder action to handle resetting the booth state
            alert("Session reset! Ready for the next user.");
            // location.reload(); // Uncomment if you want it to refresh the page entirely
        }

        // Initialize QR rendering on page load
        window.onload = function() {
            renderDigitalQRs();
        };
    </script>

</body>
</html>
